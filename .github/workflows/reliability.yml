name: KSeF - tests and Windows build

on:
  push:
    branches:
      - hardening/ksef-reliability-20261117
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: {{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: {{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m py_compile ksef_app_selenium_edge_fix.py ksef_stable.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  windows-build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --clean Ksef-Pobieranie.spec
      - run: if (!(Test-Path "dist/Ksef-Pobieranie.exe")) { throw "Missing EXE" }
        shell: pwsh
